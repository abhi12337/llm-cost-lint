# Copy to .github/workflows/llm-cost-lint.yml in a repo that calls LLM APIs.
# Static only: it reads the checked-out files, never runs your code and never calls a model.
name: llm-cost-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  llm-cost-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin to a release tag or commit of llm-cost-lint you have reviewed.
      - run: pipx install "git+https://github.com/OWNER/llm-cost-lint@v0.1.0"
      - name: Lint LLM calls (fails on medium and above)
        run: llm-cost-lint scan . --no-color --fail-on medium
      - name: JSON report artifact
        if: always()
        run: llm-cost-lint scan . --json --fail-on never > llm-cost-lint.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-cost-lint-report
          path: llm-cost-lint.json
