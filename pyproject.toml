[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-lint"
version = "0.1.0"
description = "Static lint for LLM API calls that waste money or break in production: missing output caps and timeouts, unbounded fan-out and chat history, uncached prompts, retired models (OpenAI, Anthropic, Google GenAI, Vercel AI SDK, LangChain, LiteLLM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abheesht Tripathi" }]
keywords = ["llm", "openai", "anthropic", "claude", "gemini", "langchain", "litellm", "vercel-ai-sdk", "cost", "lint", "static-analysis", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
llm-cost-lint = "llm_cost_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_cost_lint = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/abhi12337/llm-cost-lint"
Issues = "https://github.com/abhi12337/llm-cost-lint/issues"
